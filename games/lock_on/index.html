<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No viewport-fit=cover on purpose: on notched phones the browser then keeps the game (and its
     touch controls) inside the safe area instead of under the notch / home bar. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lock-On">
<meta name="theme-color" content="#000000">
<!-- where the title screen's QUIT goes: the LORPcade home page, one level up from this game's folder -->
<meta name="lorpcade-home" content="../">
<title>LOCK-ON</title>
<!-- Cloud saves: one script shared by the whole LORPcade site (published at /arcade-assets/). Without it (a game
     served on its own) everything below simply skips syncing. -->
<script src="../arcade-assets/lorpcade-sync.js"></script>
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* The canvas is sized by CSS; the game follows it (winit reports every resize).
     dvh = the visible height on phones, where 100vh includes the area under the browser bars. */
  canvas#game { position: fixed; inset: 0; display: block; width: 100%; height: 100vh; height: 100dvh; outline: none; touch-action: none; }
  #overlay, #rotate {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(0, 0, 0, 0.82); color: #cfe3f5; font: 600 18px/1.4 system-ui, sans-serif;
    letter-spacing: 0.08em; text-align: center; padding: 24px; cursor: default; box-sizing: border-box;
  }
  #overlay h1 { margin: 0; font-size: 34px; letter-spacing: 0.22em; color: #fff; }
  #overlay small { font-weight: 400; font-size: 14px; letter-spacing: 0.03em; opacity: 0.75; max-width: 46em; }
  #overlay.ready { cursor: pointer; }
  #saveTools { display: none; gap: 10px; margin-top: 6px; }
  #overlay.ready #saveTools { display: flex; }
  #saveTools button {
    font: 600 13px/1 system-ui, sans-serif; letter-spacing: 0.08em; color: #cfe3f5; background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(207, 227, 245, 0.4); border-radius: 6px; padding: 9px 14px; cursor: pointer;
  }
  #saveTools button:hover { background: rgba(255, 255, 255, 0.18); }
  #saveNote { min-height: 1.2em; font-size: 13px; opacity: 0.85; }
  #syncBtn[hidden] { display: none; }
  #syncBtn.on { border-color: #ffe14d; }
  #syncBtn.bad { border-color: #ff9a5a; }
  /* "the cloud save changed on another device" */
  #stale { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; gap: 10px; align-items: center; justify-content: center;
    flex-wrap: wrap; padding: 8px 12px; background: #ffe14d; color: #12002a; font: 600 14px/1.3 system-ui, sans-serif; }
  #stale[hidden] { display: none; }
  #stale button { font: inherit; padding: 4px 10px; border: 2px solid #12002a; background: transparent; color: inherit; cursor: pointer; }
  #overlay.gone { display: none; }
  #overlay.error { color: #ffb4a8; }
  /* phones in landscape are short: tighten the start screen */
  body.mobile #overlay h1 { font-size: 26px; }
  body.mobile #overlay { gap: 8px; font-size: 16px; }
  body.mobile #overlay small { font-size: 13px; }
  /* touch devices held upright: ask for landscape (the game is landscape only) */
  #rotate { display: none; z-index: 10; background: #000; }
  #rotate .icon { font-size: 54px; display: inline-block; animation: tilt 2.2s ease-in-out infinite; }
  @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { body.mobile #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="overlay">
  <h1>LOCK-ON</h1>
  <div id="msg">Loading...</div>
  <small id="hint"></small>
  <div id="saveTools">
    <button id="saveExport" type="button">EXPORT SAVE</button>
    <button id="saveImport" type="button">IMPORT SAVE</button>
    <button id="syncBtn" type="button" hidden>CLOUD SYNC</button>
  </div>
  <small id="saveNote"></small>
  <input id="saveFile" type="file" accept=".txt,text/plain" hidden>
</div>
<div id="stale" hidden role="status">A newer save was found on another device.
  <button id="staleReload" type="button">RELOAD</button> <button id="staleClose" type="button" aria-label="Dismiss">&times;</button></div>
<div id="rotate"><span class="icon">&#128241;</span><div>ROTATE YOUR PHONE TO LANDSCAPE</div></div>
<script type="module">
  import init from "./lock_on.js";

  // this game's folder name: the key suffix the home page and the cloud save use for it
  const folderName = (() => {
    const meta = document.querySelector('meta[name="lorpcade-slug"]');
    if (meta && meta.content) return meta.content;
    const parts = location.pathname.split("/").filter(Boolean);
    if (parts.length && /\.[a-z0-9]+$/i.test(parts[parts.length - 1])) parts.pop(); // .../index.html
    return parts.length ? decodeURIComponent(parts[parts.length - 1]) : "lock_on";
  })();

  const canvas = document.getElementById("game");
  const overlay = document.getElementById("overlay");
  const msg = document.getElementById("msg");
  const hint = document.getElementById("hint");

  // ---------------------------------------------------------------------------------------------
  // Phones and tablets get touch controls (drag the open screen to steer). `?mobile=1` / `?mobile=0` forces it
  // either way (handy for trying it in desktop browser devtools' device mode).
  // ---------------------------------------------------------------------------------------------
  const params = new URLSearchParams(location.search);
  const ua = navigator.userAgent || "";
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  function detectMobile() {
    if (params.has("mobile")) return params.get("mobile") !== "0";
    if (navigator.userAgentData && navigator.userAgentData.mobile) return true;
    if (/Android|iPhone|iPad|iPod|Mobile|Silk/i.test(ua) || isIOS) return true;
    // anything else whose main input is a finger and that cannot hover (a mouse-driven touch laptop is not)
    return matchMedia("(pointer: coarse)").matches && matchMedia("(hover: none)").matches && navigator.maxTouchPoints > 0;
  }
  const MOBILE = detectMobile();
  if (MOBILE) document.body.classList.add("mobile");

  window.esIsMobile = () => MOBILE;
  // `?fps=30` makes the game's quality governor hold that frame rate instead of the display's (see src/gfx/quality.rs)
  window.esFpsCap = () => { const f = parseFloat(params.get("fps")); return f > 0 ? f : 0; };

  if (MOBILE) {
    // no pinch zoom, no scrolling, no long-press menu: it is a game
    document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
    document.addEventListener("gesturestart", (e) => e.preventDefault());
    document.addEventListener("contextmenu", (e) => e.preventDefault());
  }

  // ---------------------------------------------------------------------------------------------
  // Tilt steering (phones). The game wants "which way is down" in screen axes (x right, y up the screen, z out of it),
  // from which it works out pitch and roll (src/touch.rs). The device-orientation angles are turned into that vector
  // here, with the screen's rotation applied, so it is right whichever way round the phone is held in landscape.
  // iPhones ask permission first, which has to come from a tap: enableTilt() is called from the start-screen tap.
  // `?tilt=0` switches it off.
  // ---------------------------------------------------------------------------------------------
  const TILT_WANTED = MOBILE && params.get("tilt") !== "0";
  let grav = null, gravAt = 0, tiltListening = false;
  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
    // down, in the device's own axes (x right, y up, z out of the screen when held upright in portrait)
    const dx = Math.cos(b) * Math.sin(g), dy = -Math.sin(b), dz = -Math.cos(b) * Math.cos(g);
    let a = (screen.orientation && typeof screen.orientation.angle === "number") ? screen.orientation.angle : (window.orientation || 0);
    a = ((a % 360) + 360) % 360;
    let sx = dx, sy = dy;
    if (a === 90) { sx = -dy; sy = dx; } else if (a === 270) { sx = dy; sy = -dx; } else if (a === 180) { sx = -dx; sy = -dy; }
    grav = [sx, sy, dz];
    gravAt = performance.now();
  }
  function listenTilt() {
    if (tiltListening) return;
    tiltListening = true;
    window.addEventListener("deviceorientation", onOrient, true);
  }
  function enableTilt() {
    if (!TILT_WANTED) return;
    try {
      const DOE = window.DeviceOrientationEvent;
      if (DOE && typeof DOE.requestPermission === "function") {
        DOE.requestPermission().then((r) => { if (r === "granted") listenTilt(); }).catch(() => {});
      } else if (DOE) listenTilt();
    } catch (_) {}
  }
  // NaN = no reading (no sensor, no permission, or nothing for the last moments)
  const gravAxis = (i) => (grav && performance.now() - gravAt < 800) ? grav[i] : NaN;
  window.esGravityX = () => gravAxis(0);
  window.esGravityY = () => gravAxis(1);
  window.esGravityZ = () => gravAxis(2);

  // ---------------------------------------------------------------------------------------------
  // Music. The soundtrack is packed into the wasm file as Opus (src/audio/web.rs hands a track over each time
  // it is asked for); Web Audio decodes it the first time it plays and keeps the last few. Loops use the
  // song's own loop points, so intros play once. (The sound effects are further down.)
  // ---------------------------------------------------------------------------------------------
  let actx = null, master = null, musicRate = 1, curTrack = null, pendingTrack = null, playToken = 0;
  const decoded = new Map(); // name -> AudioBuffer, least recently used first

  function audioCtx() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = 0.8;
      master.connect(actx.destination);
    }
    return actx;
  }
  // `bytes` is a view into the wasm memory that is only valid during the call: copy it before awaiting.
  async function trackBuffer(name, bytes) {
    if (decoded.has(name)) { const b = decoded.get(name); decoded.delete(name); decoded.set(name, b); return b; }
    const copy = bytes.slice().buffer;
    const buf = await audioCtx().decodeAudioData(copy);
    decoded.set(name, buf);
    while (decoded.size > 4) decoded.delete(decoded.keys().next().value);
    return buf;
  }
  function stopTrack() {
    if (!curTrack) return;
    curTrack.ended = true;
    if (curTrack.src) { curTrack.src.onended = null; try { curTrack.src.stop(); } catch (_) {} }
    curTrack = null;
  }
  function startTrack(name, looping, ls, le, bufPromise) {
    const token = ++playToken;
    pendingTrack = null;
    stopTrack();
    const entry = curTrack = { name, looping, src: null, ended: false };
    bufPromise.then((buf) => {
      if (token !== playToken) return;
      const src = actx.createBufferSource();
      src.buffer = buf;
      src.loop = looping;
      if (looping && le > ls && ls >= 0) { src.loopStart = ls; src.loopEnd = Math.min(le, buf.duration); }
      src.playbackRate.value = looping ? musicRate : 1;
      src.connect(master);
      src.onended = () => {
        entry.ended = true;
        if (curTrack === entry && pendingTrack) { const q = pendingTrack; startTrack(q.name, q.looping, q.ls, q.le, q.buf); }
      };
      src.start();
      entry.src = src;
    }).catch((e) => { entry.ended = true; console.warn("music: could not play", name, e); });
  }
  window.esMusicPlay = (name, bytes, looping, queue, ls, le) => {
    if (!audioCtx()) return;
    if (queue && curTrack && !curTrack.looping && !curTrack.ended) { // wait for the one-shot that is playing
      pendingTrack = { name, looping, ls, le, buf: trackBuffer(name, bytes) };
      return;
    }
    if (curTrack && curTrack.name === name && curTrack.looping === looping && !curTrack.ended) return;
    startTrack(name, looping, ls, le, trackBuffer(name, bytes));
  };
  window.esMusicRate = (r) => {
    musicRate = r;
    if (curTrack && curTrack.looping && curTrack.src) curTrack.src.playbackRate.value = r;
  };
  // ---------------------------------------------------------------------------------------------
  // Sound effects. Like the music they are Opus renders packed into the wasm file (src/audio/web.rs hands every one
  // over once, at start-up, so they are decoded before they are needed). Playing one afterwards is just its name.
  //  * one-shots (cannon, rocket, flare, explosions...) play once; the game stops the cannon burst by name
  //  * two alarm slots loop (0 = missile warning, 1 = terrain / stall)
  //  * the engine drone has no live synth here: the steady middle of the cruise render loops, its pitch follows the
  //    throttle (playbackRate), and the afterburner render fades in on top of it when boosting
  // ---------------------------------------------------------------------------------------------
  const sfx = new Map(); // name -> { buf: Promise<AudioBuffer>, ls, le }
  const SFX_LEVEL = { cannon_burst: 0.5, cannon_single: 0.5, rocket_launch: 0.9, _explosion: 0.9, _big_explosion: 1.0, _hit: 0.9,
                      missile_lock: 0.55, missile_incoming: 0.6, missile_imminent: 0.65, pull_up_beep: 0.55, pull_up_siren: 0.6 };
  const MAX_SHOTS = 16;
  let sfxBusNode = null;
  const shots = [];          // live one-shot voices, oldest first
  const alarmVoice = [null, null], alarmName = ["", ""];
  let eng = null;

  function sfxBus() {
    if (!sfxBusNode && audioCtx()) { sfxBusNode = actx.createGain(); sfxBusNode.gain.value = 0.9; sfxBusNode.connect(master); }
    return sfxBusNode;
  }
  window.esSfxLoad = (name, bytes, ls, le) => {
    if (!audioCtx()) return;
    const buf = actx.decodeAudioData(bytes.slice().buffer); // copy: `bytes` is a view into the wasm memory
    buf.catch((e) => console.warn("sfx: could not decode", name, e));
    sfx.set(name, { buf, ls, le });
  };
  function voice(name, loop) {
    const e = sfx.get(name);
    if (!e || !sfxBus()) return null;
    const gain = actx.createGain();
    gain.gain.value = SFX_LEVEL[name] ?? 0.8;
    gain.connect(sfxBus());
    const v = { name, src: null, gain, dead: false };
    e.buf.then((buf) => {
      if (v.dead) return;
      const src = actx.createBufferSource();
      src.buffer = buf;
      if (loop && e.le > e.ls) { src.loop = true; src.loopStart = e.ls; src.loopEnd = Math.min(e.le, buf.duration); }
      src.connect(gain);
      src.onended = () => { v.dead = true; try { gain.disconnect(); } catch (_) {} const i = shots.indexOf(v); if (i >= 0) shots.splice(i, 1); };
      src.start();
      v.src = src;
    }).catch(() => {});
    return v;
  }
  // a short fade instead of a hard cut, so stopping a sound does not click
  function endVoice(v, fade = 0.04) {
    if (!v || v.dead) return;
    v.dead = true;
    try {
      const t = actx.currentTime;
      v.gain.gain.cancelScheduledValues(t);
      v.gain.gain.setValueAtTime(v.gain.gain.value, t);
      v.gain.gain.linearRampToValueAtTime(0, t + fade);
      if (v.src) { v.src.onended = null; v.src.stop(t + fade + 0.01); }
      setTimeout(() => { try { v.gain.disconnect(); } catch (_) {} }, (fade + 0.1) * 1000);
    } catch (_) {}
  }
  window.esSfxPlay = (name) => {
    const v = voice(name, false);
    if (!v) return;
    shots.push(v);
    while (shots.length > MAX_SHOTS) endVoice(shots.shift(), 0.02);
  };
  window.esSfxStop = (name) => {
    for (let i = shots.length - 1; i >= 0; i--) if (shots[i].name === name) endVoice(shots.splice(i, 1)[0]);
  };
  window.esAlarm = (slot, name) => {
    if (slot < 0 || slot > 1 || alarmName[slot] === name) return;
    alarmName[slot] = name;
    endVoice(alarmVoice[slot], 0.05);
    alarmVoice[slot] = name ? voice(name, true) : null;
  };
  function engineStart() {
    const c = sfx.get("engine_cruise"), b = sfx.get("engine_afterburner");
    if (!c || !b || !sfxBus()) return;
    const e = eng = { parts: [], ready: false, thr: 0.5, boost: false };
    Promise.all([c.buf, b.buf]).then(([cb, bb]) => {
      if (eng !== e) return;
      for (const [buf, ent] of [[cb, c], [bb, b]]) {
        const src = actx.createBufferSource();
        src.buffer = buf; src.loop = true; src.loopStart = ent.ls; src.loopEnd = Math.min(ent.le, buf.duration);
        const gain = actx.createGain();
        gain.gain.value = 0;
        src.connect(gain); gain.connect(sfxBus());
        src.start(0, ent.ls);
        e.parts.push({ src, gain });
      }
      e.ready = true;
      engineApply(e);
    }).catch(() => { if (eng === e) eng = null; });
  }
  function engineApply(e) {
    if (!e.ready) return;
    const t = actx.currentTime, rate = 0.85 + 0.5 * e.thr + (e.boost ? 0.1 : 0);
    const [cruise, burn] = e.parts;
    cruise.src.playbackRate.setTargetAtTime(rate, t, 0.15);
    burn.src.playbackRate.setTargetAtTime(rate, t, 0.15);
    cruise.gain.gain.setTargetAtTime(0.16 + 0.2 * e.thr, t, 0.15);
    burn.gain.gain.setTargetAtTime(e.boost ? 0.4 : 0, t, 0.25);
  }
  window.esEngine = (on, thr, boost) => {
    if (!on) {
      if (eng) {
        const e = eng; eng = null;
        if (e.ready) for (const p of e.parts) { try { p.gain.gain.setTargetAtTime(0, actx.currentTime, 0.08); p.src.stop(actx.currentTime + 0.4); } catch (_) {} }
      }
      return;
    }
    if (!audioCtx()) return;
    if (!eng) engineStart();
    if (!eng) return;
    eng.thr = thr; eng.boost = boost;
    engineApply(eng);
  };

  // autoplay rules: the context starts suspended until a gesture; any tap / key resumes it. A hidden tab is silent.
  function wakeAudio() { if (actx && actx.state === "suspended") actx.resume().catch(() => {}); }
  for (const ev of ["pointerdown", "touchend", "keydown", "click"]) window.addEventListener(ev, wakeAudio, { capture: true });
  document.addEventListener("visibilitychange", () => {
    if (!actx) return;
    if (document.visibilityState === "hidden") actx.suspend().catch(() => {}); else wakeAudio();
  });

  // ---------------------------------------------------------------------------------------------
  // Cloud saves (shared script: ../arcade-assets/lorpcade-sync.js, set up per instruction.md). With a sync code
  // this device's save is brought up to date BEFORE the game starts (the game reads localStorage once, when it
  // boots), and every later save is pushed shortly after the game writes it. The game itself knows nothing about it.
  // If the cloud copy changes on another device while the game is open, a bar offers a reload.
  //   esSyncInfo: what the title screen's SYNC button says ("" = sync is not set up, so no button)
  //   esSyncOpen: that button
  // ---------------------------------------------------------------------------------------------
  const SYNC = window.LorpSync || null;
  const syncBtn = document.getElementById("syncBtn");
  const stale = document.getElementById("stale");
  const openSync = () => { if (SYNC) SYNC.openDialog({ slugs: [folderName], onApplied: () => location.reload() }); };
  window.esSyncInfo = () => { try { return SYNC && SYNC.enabled ? SYNC.label() : ""; } catch (_) { return ""; } };
  window.esSyncOpen = openSync;
  document.getElementById("staleReload").addEventListener("click", () => location.reload());
  document.getElementById("staleClose").addEventListener("click", () => { stale.hidden = true; });
  function paintSyncBtn() {
    if (!SYNC) return;
    const l = SYNC.label();
    syncBtn.hidden = !l;
    syncBtn.textContent = "CLOUD SYNC: " + l;
    syncBtn.className = l === "ON" || l === "SYNCING" ? "on" : l === "OFFLINE" || l === "ERROR" ? "bad" : "";
  }
  syncBtn.addEventListener("click", (e) => { e.stopPropagation(); openSync(); });
  async function cloudStart() {
    if (!SYNC) return;
    try {
      // a cloud copy that is not a sealed Lock-On save never replaces a good local one
      SYNC.validators[folderName] = (name, text) => name === "save" ? /^LOSAVE1:[A-Za-z0-9_-]+$/.test(text) : name !== "hiscore" || /^[0-9]{1,15}$/.test(text);
      SYNC.on(paintSyncBtn);
      await SYNC.ready;
      paintSyncBtn();
      if (!SYNC.enabled) return;
      if (SYNC.getCode()) {
        msg.textContent = "Syncing save...";
        await SYNC.syncGame(folderName, { timeout: 4000 }); // never rejects; gives up after 4 s so a bad connection can't block play
        msg.textContent = "Loading...";
      }
      SYNC.watch(folderName, { onRemote: () => { stale.hidden = false; } });
    } catch (_) {}
  }

  // ---------------------------------------------------------------------------------------------
  // Saves live in this browser's localStorage. Chrome sync does NOT carry site data across devices, so the
  // start screen has EXPORT / IMPORT: a plain-text file (same sealed format as the Windows savegame.txt) that can
  // be moved by Drive, e-mail, a messaging app... The page also asks the browser to keep the data safe
  // from automatic clean-up.
  // ---------------------------------------------------------------------------------------------
  const SAVE_KEY = "lorpcade:lock_on:save";
  const saveNote = document.getElementById("saveNote");
  const say = (t) => { saveNote.textContent = t; };
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (_) {}
  function readSave() { try { return localStorage.getItem(SAVE_KEY); } catch (_) { return null; } }

  document.getElementById("saveExport").addEventListener("click", async (e) => {
    e.stopPropagation();
    const txt = readSave();
    if (!txt) { say("Nothing to export yet: play a sortie first."); return; }
    try {
      const url = URL.createObjectURL(new Blob([txt], { type: "text/plain" }));
      const a = document.createElement("a");
      a.href = url; a.download = "lockon-save.txt";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      let copied = false;
      try { await navigator.clipboard.writeText(txt); copied = true; } catch (_) {}
      say("Saved lockon-save.txt" + (copied ? " (and copied to the clipboard)" : "") + ". Use IMPORT SAVE on the other device.");
    } catch (_) { say("Could not export the save."); }
  });
  const saveFile = document.getElementById("saveFile");
  document.getElementById("saveImport").addEventListener("click", (e) => { e.stopPropagation(); saveFile.click(); });
  saveFile.addEventListener("click", (e) => e.stopPropagation());
  saveFile.addEventListener("change", async () => {
    const f = saveFile.files && saveFile.files[0];
    saveFile.value = "";
    if (!f) return;
    let txt;
    try { txt = await f.text(); } catch (_) { say("Could not read that file."); return; }
    // Plain text is deliberately not importable: it is trivially hand-editable (see H1).
    const looksRight = /^\s*LOSAVE1:[A-Za-z0-9_-]+\s*$/.test(txt);
    if (!looksRight) { say("That does not look like a Lock-On save file."); return; }
    if (readSave() && !confirm("Replace the progress saved in this browser with the imported save?")) return;
    try { localStorage.setItem(SAVE_KEY, txt); location.reload(); } catch (_) { say("Could not write the save (is storage blocked?)."); }
  });

  // ---------------------------------------------------------------------------------------------
  // The LORPcade home page (https://lorpcade.github.io/). The game lives in a folder one level
  // below it, so "../" reaches the home page wherever the site is hosted; the <meta name="lorpcade-home">
  // in the <head> can point elsewhere.
  //  * esGoHome: the title screen's QUIT. Leaves fullscreen / the landscape lock first, then navigates.
  //  * esHiscore: the game reports its best Score Attack score; it is kept under the key the home page reads for
  //    this game's cabinet ("HI 012300"): lorpcade:hiscore:<this folder's name>. The page keeps the key in
  //    sync with the save, so an imported save updates the cabinet too.
  // ---------------------------------------------------------------------------------------------
  const homeMeta = document.querySelector('meta[name="lorpcade-home"]');
  window.esGoHome = () => {
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (_) {}
    try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (_) {}
    location.assign(new URL((homeMeta && homeMeta.content) || "../", location.href).href);
  };
  window.esHiscore = (score) => {
    try {
      const key = "lorpcade:hiscore:" + folderName, v = String(Math.max(0, Math.floor(score)));
      if (localStorage.getItem(key) !== v) localStorage.setItem(key, v);
    } catch (_) {}
  };

  // ---------------------------------------------------------------------------------------------
  // Everything that needs the first tap: fullscreen, landscape lock, wake lock.
  // ---------------------------------------------------------------------------------------------
  const fsRoot = document.documentElement;
  const fsRequest = fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen;
  const standalone = window.navigator.standalone === true || matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches;
  let wakeLock = null;

  async function acquireWakeLock() {
    try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (_) {}
  }
  // Browsers drop the lock while the tab is hidden; ask again on every return, not only before the
  // start overlay is dismissed (the "ready" class is added once and never removed).
  document.addEventListener("visibilitychange", () => { if (MOBILE && document.visibilityState === "visible") acquireWakeLock(); });

  async function startMobile() {
    // the requests must be made straight from the tap, so fire them together
    const fs = (fsRequest && !document.fullscreenElement && !document.webkitFullscreenElement)
      ? Promise.resolve(fsRequest.call(fsRoot, { navigationUI: "hide" })).catch(() => {}) : Promise.resolve();
    acquireWakeLock();
    await fs;
    // landscape lock only works once fullscreen is up (and not at all on iOS Safari)
    try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape"); } catch (_) {}
  }

  function fail(text) {
    overlay.className = "error";
    msg.textContent = text;
    hint.textContent = "Open the browser console (F12) for details.";
  }

  if (!navigator.gpu) {
    fail("This browser has no WebGPU support.");
    hint.textContent = "Use a recent Chrome, Edge, Firefox or Safari with WebGPU enabled, on a device with a supported GPU.";
  } else {
    // Any panic in the game ends up here (the wasm module traps).
    // (browsers report a harmless "ResizeObserver loop" notice - winit watches the canvas size - through the same event;
    // it is not a crash and must not put the error screen over a running game)
    window.addEventListener("error", (e) => { if (/ResizeObserver/i.test((e && e.message) || "")) return; fail("Something went wrong."); });
    window.addEventListener("unhandledrejection", () => fail("Something went wrong."));

    cloudStart().then(() => init()).then(() => {
      if (MOBILE) {
        msg.textContent = "TAP TO START";
        hint.textContent = "Tilt the phone to roll and pitch (hold it how you like during the 3-second countdown: that is level), and drag a finger on the open screen to steer more, like a mouse. Left thumb: cannon, missile / bomb, weapon switch, flares. Right thumb: throttle slider, boost, brake. Each sortie starts with a 3-second countdown. Progress is saved in this browser (CLOUD SYNC shares it between devices).";
        // iPhone Safari cannot go fullscreen from a web page; a home-screen app can
        if (isIOS && !fsRequest && !standalone) {
          hint.textContent += " For full screen on iPhone: Share, then Add to Home Screen, and open it from there.";
        }
      } else {
        msg.textContent = "CLICK TO START";
        hint.textContent = "Mouse + keyboard. Progress is saved in this browser. CLOUD SYNC (or EXPORT / IMPORT SAVE) moves it between devices.";
      }
      overlay.classList.add("ready");
      // Keyboard events go to the focused canvas, and audio / pointer lock need a user gesture anyway.
      overlay.addEventListener("click", () => {
        overlay.classList.add("gone");
        canvas.focus();
        if (MOBILE) { enableTilt(); startMobile(); }
      }, { once: true });
    }).catch((e) => { console.error(e); fail("Failed to load the game."); });
  }
</script>
</body>
</html>
