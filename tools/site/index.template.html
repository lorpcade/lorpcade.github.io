<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LORPcade</title>
<meta name="description" content="LORPcade is a free browser arcade. Pick a game and press start.">
<meta name="theme-color" content="#0d0221">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%230d0221'/%3E%3Cpath d='M2 1h2v5h3v1H2z' fill='%23ff2e97'/%3E%3C/svg%3E">
<link rel="preload" href="arcade-assets/fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Press Start 2P"; src: url("arcade-assets/fonts/press-start-2p.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "VT323"; src: url("arcade-assets/fonts/vt323.woff2") format("woff2"); font-display: swap; }

:root {
  --void: #0d0221;      /* inside the cabinet */
  --panel: #241058;     /* control deck */
  --magenta: #ff2e97;
  --cyan: #2de2ff;
  --yellow: #ffe14d;
  --orange: #ff7a1a;
  --ink: #f3e9ff;
  --dim: #b4a6dc;
  --display: "Press Start 2P", ui-monospace, "Courier New", monospace;
  --body: "VT323", ui-monospace, "Courier New", monospace;
}

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--void); color-scheme: dark; }
body {
  margin: 0; min-height: 100svh; overflow-x: hidden;
  font: 22px/1.2 var(--body); color: var(--ink);
  background: radial-gradient(120% 70% at 50% 0%, #34107e 0%, rgba(52, 16, 126, 0) 60%), var(--void);
}
/* stars */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; opacity: .6;
  background-image:
    radial-gradient(1px 1px at 20px 30px, #fff, transparent),
    radial-gradient(1px 1px at 120px 80px, #9ff, transparent),
    radial-gradient(2px 2px at 220px 150px, #fff, transparent),
    radial-gradient(1px 1px at 70px 190px, #fdf, transparent),
    radial-gradient(1px 1px at 270px 40px, #fff, transparent);
  background-size: 300px 220px;
}
/* CRT: scanlines + vignette over the page (the cabinets sit above it, so covers stay clean) */
.crt {
  position: fixed; inset: 0; z-index: 50; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.2) 2px 3px),
    radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.5) 100%);
}
a { color: var(--cyan); }
code { font: inherit; color: var(--yellow); }
:focus-visible { outline: 3px dashed var(--yellow); outline-offset: 4px; }

/* ---------- HUD ---------- */
.hud {
  position: relative; z-index: 2;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: calc(14px + env(safe-area-inset-top)) clamp(14px, 3vw, 32px) 14px;
  font: 10px/1 var(--display); text-transform: uppercase;
}
.hud .lbl { color: var(--cyan); }
.hud .val { margin-left: .8em; color: var(--ink); }
.hud .free { color: var(--yellow); }
.hud button {
  font: inherit; text-transform: inherit; color: var(--cyan); background: none; border: 0;
  padding: 8px 0; cursor: pointer;
}
.hud button b { margin-left: .8em; font-weight: 400; color: var(--ink); }
.hud button[aria-pressed="true"] b { color: var(--yellow); }
.hud .btns { display: flex; gap: clamp(14px, 3vw, 28px); }
.hud button[hidden] { display: none; }
.hud #sync[data-state="on"] b, .hud #sync[data-state="syncing"] b { color: var(--yellow); }
.hud #sync[data-state="offline"] b, .hud #sync[data-state="error"] b { color: var(--orange); }

/* ---------- hero: the sign ---------- */
.hero {
  position: relative; isolation: isolate; overflow: hidden;
  display: grid; place-items: center;
  height: clamp(230px, 33vh, 330px);
}
.scenery { position: absolute; inset: 0; z-index: -1; }
.scenery .sun {
  position: absolute; left: 50%; top: 70%; width: min(64vw, 380px); aspect-ratio: 1; border-radius: 50%;
  transform: translate(-50%, -50%);
  background: linear-gradient(180deg, var(--yellow) 8%, var(--orange) 50%, var(--magenta) 92%);
  -webkit-mask-image: linear-gradient(#000 0 52%, transparent 52% 56%, #000 56% 63%, transparent 63% 69%, #000 69% 77%, transparent 77% 85%, #000 85% 100%);
          mask-image: linear-gradient(#000 0 52%, transparent 52% 56%, #000 56% 63%, transparent 63% 69%, #000 69% 77%, transparent 77% 85%, #000 85% 100%);
  clip-path: inset(0 0 50% 0);                 /* only the half above the horizon */
  filter: drop-shadow(0 0 40px rgba(255, 46, 151, .55));
}
.scenery .floor {
  position: absolute; left: 0; right: 0; top: 70%; bottom: 0; overflow: hidden;
  background: linear-gradient(180deg, #1a0450, var(--void));
  -webkit-mask-image: linear-gradient(#000 45%, transparent); mask-image: linear-gradient(#000 45%, transparent);
  border-top: 2px solid var(--magenta);
  box-shadow: 0 -6px 30px rgba(255, 46, 151, .6);
}
.scenery .floor::before {
  content: ""; position: absolute; left: -80%; right: -80%; top: 0; bottom: -60%;
  background:
    linear-gradient(var(--magenta) 2px, transparent 2px) 0 0 / 100% 36px,
    linear-gradient(90deg, var(--magenta) 2px, transparent 2px) 0 0 / 56px 100%;
  transform: perspective(240px) rotateX(62deg); transform-origin: 50% 0;
  animation: roll 1.6s linear infinite;
  opacity: .85;
}
@keyframes roll { to { background-position: 0 36px, 0 0; } }

/* the wordmark: stacked extrusion behind a banded chrome face */
.logo {
  position: relative; margin: 0 0 5vh; font: clamp(30px, 10vw, 88px)/1 var(--display);
  letter-spacing: -.02em; white-space: nowrap;
}
.logo > span { display: block; }
.logo .shadow {
  position: absolute; inset: 0; color: #ff2e97;
  text-shadow:
    1px 1px 0 #e0238a, 2px 2px 0 #c21c7d, 3px 3px 0 #a31670, 4px 4px 0 #851163,
    5px 5px 0 #670d56, 6px 6px 0 #4a0a49, 7px 7px 0 #34083c, 8px 8px 0 #20052d,
    0 0 .35em rgba(255, 46, 151, .8), 0 0 .9em rgba(255, 46, 151, .5);
}
.logo .face {
  position: relative;
  background: linear-gradient(180deg, #fff 0 28%, #c9f7ff 28% 48%, var(--cyan) 48% 70%, #159fd6 70%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
}
.logo { animation: power-on 1.5s steps(1) 1 both; }
@keyframes power-on {
  0%   { opacity: 0; }  6%  { opacity: 1; }  9%  { opacity: .15; } 16% { opacity: 1; }
  21%  { opacity: .3; } 27% { opacity: 1; }  31% { opacity: .55; } 36% { opacity: 1; } 100% { opacity: 1; }
}

/* ---------- select screen ---------- */
main { max-width: 1240px; margin: 0 auto; padding: clamp(20px, 4vh, 40px) clamp(16px, 4vw, 40px) 72px; }

.floor-plan {
  list-style: none; margin: 0; padding: 0; display: grid; gap: 36px 32px; justify-content: center;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 360px));
}
.slot { display: flex; position: relative; z-index: 60; }   /* above .crt (50) */
.empty { grid-column: 1 / -1; text-align: center; color: var(--dim); }

/* ---------- cabinet ---------- */
.cab {
  --c: 8px; display: block; flex: 1; min-width: 0; position: relative; color: inherit; text-decoration: none;
  container-type: inline-size;
  filter: drop-shadow(0 0 14px color-mix(in srgb, var(--accent) 45%, transparent));
  transition: transform .12s steps(2), filter .12s steps(2);
}
.cab:hover, .cab:focus-visible {
  transform: translateY(-6px);
  filter: drop-shadow(0 0 26px color-mix(in srgb, var(--accent) 85%, transparent));
}
.cab:focus-visible { outline-offset: 10px; }
.cab:active { transform: translateY(-2px); }
.frame, .cab-in {
  clip-path: polygon(0 var(--c), var(--c) var(--c), var(--c) 0, calc(100% - var(--c)) 0, calc(100% - var(--c)) var(--c), 100% var(--c),
                     100% calc(100% - var(--c)), calc(100% - var(--c)) calc(100% - var(--c)), calc(100% - var(--c)) 100%,
                     var(--c) 100%, var(--c) calc(100% - var(--c)), 0 calc(100% - var(--c)));
}
.frame { height: 100%; padding: 6px; background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 40%, var(--magenta))); }
.cab-in { --c: 6px; height: 100%; display: flex; flex-direction: column; background: var(--void); }

.bezel { padding: 14px 14px 10px; background: #05010f; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.screen {
  position: relative; aspect-ratio: 1 / 1; overflow: hidden; border-radius: 14px / 12px; background: #05010f;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .07), 0 0 0 3px #1a0b3d;
}
.screen .glass { position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background:
    linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,0) 32%),
    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%); }
.art-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

/* generated screen for games without a cover: sun over a grid, tinted by the game's colour */
.art-gen { position: absolute; inset: 0;
  background: linear-gradient(180deg, #12053a 0%, color-mix(in srgb, var(--accent) 42%, #1b0850) 60%); }
.art-gen i { position: absolute; display: block; }
.art-gen .sun {
  left: 50%; top: 60%; width: 46%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%);
  background: linear-gradient(180deg, var(--yellow), var(--orange) 55%, var(--magenta));
  -webkit-mask-image: linear-gradient(#000 0 50%, transparent 50% 56%, #000 56% 66%, transparent 66% 74%, #000 74% 100%);
          mask-image: linear-gradient(#000 0 50%, transparent 50% 56%, #000 56% 66%, transparent 66% 74%, #000 74% 100%);
}
.art-gen .floor { left: 0; right: 0; top: 60%; bottom: 0; overflow: hidden; background: #0b0330; border-top: 2px solid var(--accent); }
.art-gen .floor::before {
  content: ""; position: absolute; left: -70%; right: -70%; top: 0; bottom: -50%;
  background:
    linear-gradient(var(--accent) 1.5px, transparent 1.5px) 0 0 / 100% 20px,
    linear-gradient(90deg, var(--accent) 1.5px, transparent 1.5px) 0 0 / 34px 100%;
  transform: perspective(130px) rotateX(58deg); transform-origin: 50% 0;
}
.cab:hover .art-gen .floor::before, .cab:focus-visible .art-gen .floor::before { animation: roll-card .9s linear infinite; }
@keyframes roll-card { to { background-position: 0 20px, 0 0; } }

/* the score line */
.deck {
  padding: 12px 14px 14px; text-align: center; text-transform: uppercase; color: var(--ink);
  font: clamp(12px, 5.6cqi, 22px)/1.4 var(--display);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: linear-gradient(180deg, var(--panel), #170a3c); border-top: 4px solid var(--accent);
}
.deck .hi-val { font-weight: 400; text-transform: none; color: var(--yellow); text-shadow: 0 0 8px rgba(255, 225, 77, .55); }

/* ---------- native download: the white Windows logo, right of the score ---------- */
.slot { container-type: inline-size; }
.exe {
  --fs: clamp(12px, 5.6cqi, 22px); --h: calc(var(--fs) * 1.6);
  position: absolute; z-index: 2; right: calc(6px + 14px); bottom: calc(6px + 14px + var(--fs) * .7 - var(--h) / 2);
  width: var(--h); height: var(--h); display: grid; place-items: center; color: #fff; text-decoration: none;
  transition: transform .12s steps(2), filter .12s steps(2);
}
.exe .winlogo { width: 100%; height: 100%; filter: drop-shadow(2px 2px 0 var(--void)) drop-shadow(0 0 0 #fff); shape-rendering: crispEdges; }
.exe:hover, .exe:focus-visible { filter: drop-shadow(0 0 8px var(--cyan)); outline: 2px dashed var(--cyan); outline-offset: 3px; }
.slot:has(.cab:hover) .exe, .slot:has(.cab:focus-visible) .exe { transform: translateY(-6px); }
.exe:hover { transform: translateY(-8px); }

/* ---------- player (name + colour) ---------- */
.hud #who .sw { display: inline-block; width: 1em; height: 1em; margin-left: .8em; vertical-align: -.15em; border: 2px solid var(--ink); background: var(--c, #ff942e); }
.who { max-width: min(92vw, 520px); width: 100%; max-height: 92vh; overflow: auto; padding: 18px 20px; border: 3px solid var(--magenta);
  background: #170a3c; color: var(--ink); font: 20px/1.3 var(--body); box-shadow: 0 0 30px rgba(255, 46, 151, .5); }
.who::backdrop { background: rgba(5, 1, 15, .8); }
.who h2 { margin: 0 0 10px; font: 12px/1.4 var(--display); color: var(--cyan); }
.who p { margin: 8px 0; } .who small { color: var(--dim); }
.who label { display: block; margin-top: 12px; font: 10px/1.4 var(--display); color: var(--yellow); text-transform: uppercase; }
.who input[type=text] { width: 100%; margin-top: 6px; padding: 8px 10px; font: inherit; font-size: 24px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink); background: var(--void); border: 2px solid #7a6ac0; border-radius: 0; }
.who .fam { margin: 10px 0 2px; font: 9px/1 var(--display); color: var(--dim); text-transform: uppercase; }
.who .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.who .grid button { aspect-ratio: 1; border: 2px solid transparent; border-radius: 0; background: var(--c); cursor: pointer; padding: 0; }
.who .grid button[aria-pressed="true"] { border-color: #fff; outline: 2px solid var(--void); box-shadow: 0 0 0 4px var(--magenta); position: relative; z-index: 1; }
.who .grid button:focus-visible { border-color: var(--yellow); outline: none; }
.who .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.who .row button { font: 10px/1 var(--display); text-transform: uppercase; color: var(--ink); background: #241058; border: 2px solid #7a6ac0; border-radius: 0; padding: 10px 12px; cursor: pointer; }
.who .row button.go { background: var(--magenta); border-color: var(--magenta); color: #12002a; }
.who .pv { margin-left: auto; font: 11px/1 var(--display); display: flex; align-items: center; gap: 8px; }
.who .pv i { width: 22px; height: 22px; border: 2px solid var(--ink); background: var(--c); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="crt" aria-hidden="true"></div>

<header class="hud">
  <div><span class="lbl">Games</span><span class="val">{{GAME_COUNT}}</span></div>
  <div class="free">Select a game</div>
  <div class="btns">
    <button id="who" type="button" aria-haspopup="dialog" title="Your name and colour in every game that has multiplayer"><span class="lbl">Pilot</span><b>PILOT</b><i class="sw" aria-hidden="true"></i></button>
    <button id="sync" type="button" hidden aria-haspopup="dialog"><span class="lbl">Sync</span><b>Off</b></button>
    <button id="snd" type="button" aria-pressed="false" data-music="{{MUSIC}}"><span class="lbl">Sound</span><b>Off</b></button>
  </div>
</header>

<div class="hero">
  <div class="scenery" aria-hidden="true"><div class="sun"></div><div class="floor"></div></div>
  <h1 class="logo"><span class="shadow" aria-hidden="true">LORPcade</span><span class="face">LORPcade</span></h1>
</div>

<main>
  <ul class="floor-plan">{{CARDS}}
  </ul>
</main>


<dialog class="who" id="whoDlg" aria-labelledby="whoH">
  <h2 id="whoH">Your pilot</h2>
  <p>The name and colour games with multiplayer show for you. They follow you into every game, and across devices when Sync is on.<br><small>A game may use the colour as it is or only as a hint.</small></p>
  <label for="whoName">Name</label>
  <input id="whoName" type="text" maxlength="12" autocomplete="off" spellcheck="false">
  <label>Colour <span id="whoColName" style="color:var(--ink)"></span></label>
  <div id="whoGrid"></div>
  <div class="row"><button class="go" id="whoSave" type="button">Save</button><button id="whoCancel" type="button">Cancel</button><span class="pv"><i id="whoPv"></i><b id="whoPvName"></b></span></div>
</dialog>

<script src="arcade-assets/lorpcade-sync.js"></script>
<script>
(() => {
  const cards = [...document.querySelectorAll(".cab")];

  // Sound is off by default and remembered per browser. When on it plays chiptune bleeps and, if the site was
  // built with tools/site/music/main_menu.opus, loops that as menu music.
  const btn = document.getElementById("snd");
  let on = false, ctx;
  try { on = localStorage.getItem("lorpcade-sound") === "1"; } catch (e) {}
  const paint = () => { btn.setAttribute("aria-pressed", on); btn.querySelector("b").textContent = on ? "On" : "Off"; };
  const tone = (freq, at = 0, len = 0.07) => {
    if (!on) return;
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    const t = ctx.currentTime + at, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + len);
  };

  // Menu music. Nothing is downloaded until Sound is switched on, and browsers that can't decode Opus
  // (older Safari) simply stay with the bleeps.
  const MUSIC_SRC = btn.dataset.music || "", MUSIC_VOL = 0.6;
  const canOpus = !!document.createElement("audio").canPlayType('audio/ogg; codecs="opus"');
  let song, fader, armed = false, blocked = false;
  const ramp = (to, ms, done) => {
    clearInterval(fader);
    const from = song.volume, t0 = performance.now();
    fader = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / ms);
      song.volume = from + (to - from) * k;
      if (k === 1) { clearInterval(fader); if (done) done(); }
    }, 40);
  };
  // Browsers won't start audio before the visitor has interacted with the page. If Sound was left on, the music
  // waits here and starts on the first tap, click or key press anywhere (the Sound button handles its own click).
  const GESTURES = ["pointerdown", "keydown", "touchend", "click"];
  const onGesture = e => { if (!(e.target instanceof Node && btn.contains(e.target))) startSong(); };
  const waitForGesture = () => { if (!armed) { armed = true; GESTURES.forEach(ev => addEventListener(ev, onGesture, true)); } };
  const stopWaiting = () => { blocked = false; if (armed) { armed = false; GESTURES.forEach(ev => removeEventListener(ev, onGesture, true)); } };
  const startSong = () => {
    if (!on || !MUSIC_SRC || !canOpus || document.hidden) return;
    if (!song) { song = new Audio(MUSIC_SRC); song.loop = true; song.volume = 0; }
    const p = song.play();
    if (p && p.then) p.then(() => { stopWaiting(); ramp(MUSIC_VOL, 1500); }).catch(() => { blocked = true; waitForGesture(); });
  };
  const stopSong = (ms = 400) => { if (song && !song.paused) ramp(0, ms, () => song.pause()); };
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { if (song) song.pause(); } else startSong();
  });

  btn.addEventListener("click", () => {
    if (on && blocked) { tone(880); startSong(); return; }   // Sound already says On: this click is the go-ahead, not "off"
    on = !on; paint();
    try { localStorage.setItem("lorpcade-sound", on ? "1" : "0"); } catch (e) {}
    tone(880);
    if (on) startSong(); else { stopWaiting(); stopSong(); }
  });
  paint();
  startSong();                                         // Sound was left on last visit

  cards.forEach(c => {
    c.addEventListener("focus", () => tone(660));
    c.addEventListener("click", e => {
      if (!on || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();                                  // let the start jingle play, then go
      [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.07));
      stopSong(300);
      setTimeout(() => { location.href = c.href; }, 340);
    });
  });

  // High scores. Every game is served from this same origin, so they share localStorage with this page. A
  // cabinet's "HI 012300" line shows a game's best score if the game saved one under "lorpcade:hiscore:<folder>", or under the
  // key its game.json names (data-hi-key). Values can be a number, a string, or JSON with the score in it.
  const readStore = key => { try { return localStorage.getItem(key); } catch (e) { return null; } };
  const SCORE_NAMES = ["score", "hiscore", "highscore", "highScore", "high_score", "best"];
  const scoreOf = (raw, field) => {
    if (raw == null || raw === "") return null;
    let v = raw, parsed = false;
    try { v = JSON.parse(raw); parsed = true; } catch (e) {}
    if (!parsed && (field || /^\s*[{[]/.test(raw))) return null;   // broken JSON, or a field was asked for
    if (v && typeof v === "object") {
      if (field) { for (const part of field.split(".")) { v = v == null || typeof v !== "object" ? null : v[part]; } }
      else { const name = SCORE_NAMES.find(n => n in v); v = name ? v[name] : null; }
    }
    return typeof v === "number" || (typeof v === "string" && v.trim()) ? v : null;
  };
  const showScore = (v, digits) => {
    if (typeof v === "number" && Number.isFinite(v)) {
      if (!Number.isInteger(v)) return String(v);
      return digits > 0 ? String(Math.abs(v)).padStart(digits, "0").replace(/^/, v < 0 ? "-" : "") : v.toLocaleString();
    }
    return String(v).trim();
  };
  const paintScores = () => cards.forEach(c => {
    const val = c.querySelector(".hi-val");
    if (!val) return;
    const d = c.dataset, digits = d.hiDigits == null ? 6 : +d.hiDigits;
    let v = d.hiKey ? scoreOf(readStore(d.hiKey), d.hiField || "") : null;
    if (v == null) v = scoreOf(readStore("lorpcade:hiscore:" + d.slug), "");
    val.textContent = v == null ? (digits > 0 ? "0".repeat(digits) : "0") : showScore(v, digits);
  });
  paintScores();

  // Player profile: the name and colour every game with multiplayer can use. It lives in localStorage "lorpcade:profile"
  // (the same JSON the Windows games keep in %APPDATA%\\LORPcade\\profile.json) and, with Sync on, in the cloud.
  // The colour is an index 0..63 into this table (families of eight shades, 1 = darkest, 8 = palest).
  const FAMS = ["EMBER", "CRIMSON", "AMBER", "OLIVE", "TEAL", "STEEL", "VIOLET", "GUNMETAL"];
  const RGB = [[166,81,7],[197,96,8],[228,111,10],[245,127,24],[247,144,55],[255,148,46],[249,178,117],[251,195,147],
    [156,17,22],[185,21,26],[214,24,30],[231,39,45],[234,67,73],[237,96,101],[241,125,129],[244,154,157],
    [166,124,7],[197,147,8],[228,170,10],[245,186,24],[247,196,55],[248,205,86],[249,214,117],[251,223,147],
    [90,140,33],[107,166,39],[124,192,45],[140,209,60],[155,215,86],[170,222,112],[186,228,138],[201,234,164],
    [24,149,132],[29,177,157],[33,204,181],[48,221,198],[76,226,206],[103,230,213],[131,235,221],[159,239,229],
    [26,87,147],[31,103,175],[36,119,202],[51,135,219],[78,151,224],[105,167,229],[132,183,233],[160,199,238],
    [108,33,140],[128,39,166],[148,45,192],[165,60,209],[177,86,215],[189,112,222],[201,138,228],[213,164,234],
    [69,75,84],[90,98,110],[111,121,135],[136,145,157],[161,169,178],[187,192,199],[213,216,220],[238,239,241]];
  const hex = i => "rgb(" + RGB[i].join(",") + ")";
  const colName = i => FAMS[i >> 3] + " " + ((i & 7) + 1);
  const cleanName = s => String(s == null ? "" : s).toUpperCase().replace(/[^A-Z0-9 _-]/g, "").trim().slice(0, 12);
  const readProfile = () => { try { const o = JSON.parse(readStore("lorpcade:profile")); return o && typeof o === "object" && !Array.isArray(o) ? o : {}; } catch (e) { return {}; } };
  const getProfile = () => {
    if (window.LorpSync && LorpSync.profile) return LorpSync.profile.get();
    const p = readProfile(), c = Number(p.mech_colour);
    return { name: cleanName(p.multiplayer_name) || "PILOT", colour: Number.isInteger(c) && c >= 0 && c < 64 ? c : 5 };
  };
  const setProfile = (name, colour) => {
    if (window.LorpSync && LorpSync.profile) { LorpSync.profile.set({ name, colour }); return; }
    const p = readProfile(); p.multiplayer_name = cleanName(name) || "PILOT"; p.mech_colour = colour; p.updated_at = Date.now();
    try { localStorage.setItem("lorpcade:profile", JSON.stringify(p)); } catch (e) {}
  };
  const whoBtn = document.getElementById("who"), dlg = document.getElementById("whoDlg");
  const nameIn = document.getElementById("whoName"), grid = document.getElementById("whoGrid");
  let pick = 5;
  const paintWho = () => {
    const p = getProfile();
    whoBtn.querySelector("b").textContent = p.name;
    whoBtn.querySelector(".sw").style.setProperty("--c", hex(p.colour));
  };
  const paintPick = () => {
    grid.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.i === pick));
    document.getElementById("whoColName").textContent = colName(pick);
    document.getElementById("whoPv").style.setProperty("--c", hex(pick));
    document.getElementById("whoPvName").textContent = cleanName(nameIn.value) || "PILOT";
  };
  FAMS.forEach((f, fi) => {
    const h = document.createElement("div"); h.className = "fam"; h.textContent = f; grid.appendChild(h);
    const g = document.createElement("div"); g.className = "grid";
    for (let k = 0; k < 8; k++) {
      const i = fi * 8 + k, b = document.createElement("button");
      b.type = "button"; b.dataset.i = i; b.title = colName(i); b.setAttribute("aria-label", colName(i)); b.style.setProperty("--c", hex(i));
      b.addEventListener("click", () => { pick = i; tone(440 + k * 40); paintPick(); });
      g.appendChild(b);
    }
    grid.appendChild(g);
  });
  whoBtn.addEventListener("click", () => {
    const p = getProfile(); nameIn.value = p.name; pick = p.colour; paintPick();
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
    nameIn.select();
  });
  nameIn.addEventListener("input", () => { nameIn.value = nameIn.value.toUpperCase().replace(/[^A-Z0-9 _-]/g, ""); paintPick(); });
  const closeWho = () => { if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); };
  document.getElementById("whoSave").addEventListener("click", () => { setProfile(nameIn.value, pick); paintWho(); tone(880); closeWho(); });
  document.getElementById("whoCancel").addEventListener("click", closeWho);
  nameIn.addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("whoSave").click(); });
  addEventListener("lorpcade:profile", paintWho);        // the cloud had a newer one
  addEventListener("storage", e => { if (e.key === "lorpcade:profile") paintWho(); });
  paintWho();


  // Cloud saves (arcade-assets/lorpcade-sync.js). The button only appears once the site has a Firebase config.
  // Sync runs when this page opens and whenever it comes back into view: it pulls what other devices saved, pushes
  // anything a game page did not get to send before it was closed, and repaints the HI lines.
  const syncBtn = document.getElementById("sync"), LS = window.LorpSync;
  if (LS) {
    const paintSync = () => {
      const l = LS.label();
      syncBtn.hidden = !l;
      syncBtn.dataset.state = l.toLowerCase();
      syncBtn.querySelector("b").textContent = l === "SYNCING" ? "..." : l === "ON" ? "On" : l === "OFF" ? "Off" : l.charAt(0) + l.slice(1).toLowerCase();
    };
    LS.on(paintSync);
    syncBtn.addEventListener("click", () => LS.openDialog({ slugs: cards.map(c => c.dataset.slug) }));
    LS.ready.then(() => {
      paintSync();
      if (LS.enabled && LS.getCode()) LS.autoSync({ slugs: cards.map(c => c.dataset.slug), onSynced: paintScores });
    });
    addEventListener("pageshow", paintSync);
  }
  addEventListener("storage", paintScores);              // a game saved a score in another tab
  addEventListener("pageshow", paintScores);             // coming back from a game with the Back button
  addEventListener("focus", paintScores);

  // Arrow keys step through the cabinets.
  document.addEventListener("keydown", e => {
    const step = { ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1 }[e.key];
    if (!step || dlg.open || e.altKey || e.ctrlKey || e.metaKey || !cards.length) return;
    const i = cards.indexOf(document.activeElement);
    if (i < 0 && (e.key === "ArrowUp" || e.key === "ArrowDown")) return;   // let the page scroll
    e.preventDefault();
    cards[i < 0 ? 0 : (i + step + cards.length) % cards.length].focus();
  });

  // With a mouse and keyboard, start with the first cabinet selected.
  if (cards[0] && matchMedia("(hover: hover) and (pointer: fine)").matches) cards[0].focus({ preventScroll: true });
})();
</script>
